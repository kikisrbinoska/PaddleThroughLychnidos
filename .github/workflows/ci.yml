name: CI

# Build/validate only - no deployment, no registry push, no Azure steps.
# That comes later, once Azure deployment is in scope.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend-build-test:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore PaddleThroughLychnidos.slnx

      - name: Build
        run: dotnet build PaddleThroughLychnidos.slnx --no-restore --configuration Release

      # No test projects exist in the solution yet - this is a no-op today
      # and starts running real tests automatically once one is added.
      - name: Test
        run: dotnet test PaddleThroughLychnidos.slnx --no-build --configuration Release

  frontend-build-lint:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paddle-through-lychnidos-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: paddle-through-lychnidos-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Build-time only placeholder - Vite inlines this into the bundle.
          # Not a real backend; just needs to exist so the build succeeds.
          VITE_API_BASE_URL: http://localhost:8080/api

  docker-build-check:
    name: Docker build check
    runs-on: ubuntu-latest
    # Waits for both to pass first, so a broken build/lint fails fast
    # without spending CI minutes building Docker images on top of it.
    needs: [backend-build-test, frontend-build-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f PaddleThroughLychnidos.API/Dockerfile -t paddle-api:ci .

      - name: Build frontend image
        run: docker build -t paddle-web:ci ./paddle-through-lychnidos-frontend

# Once required, set these two jobs (backend-build-test, frontend-build-lint)
# and docker-build-check as required status checks under
# Settings -> Branches -> Branch protection rules for main.
