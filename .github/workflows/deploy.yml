name: Deploy

# Runs only after CI has fully passed on main - deploy.yml never builds or
# tests independently, it trusts ci.yml's jobs already did that.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write # required for AWS OIDC
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: paddle-api
  EC2_INSTANCE_ID: i-02ffd3e87fae26569
  S3_BUCKET: addle-through-lychnidos-web-2026

jobs:
  deploy-backend:
    name: Build & deploy backend
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::605606417079:role/github-actions-deploy-paddle
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f PaddleThroughLychnidos.API/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2 via SSM Run Command
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy paddle-api $IMAGE_TAG" \
            --parameters "commands=[\"sudo -u ec2-user -i bash /opt/paddle/deploy.sh $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

  deploy-frontend:
    name: Build & deploy frontend
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    defaults:
      run:
        working-directory: paddle-through-lychnidos-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: paddle-through-lychnidos-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://16.16.24.158/api

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::605606417079:role/github-actions-deploy-paddle
          aws-region: eu-north-1

      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${{ env.S3_BUCKET }}" --delete
