services:
  api:
    image: ${ECR_IMAGE}
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: ${DB_CONNECTION_STRING}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-PaddleThroughLychnidos}
      Jwt__Audience: ${JWT_AUDIENCE:-PaddleThroughLychnidos}
      YouTube__ApiKey: ${YOUTUBE_API_KEY:-}
    # Bind-mounted to a fixed host path (outside the container's own
    # filesystem) so uploaded shop/product photos and verification
    # documents survive `docker compose up -d` recreating this container on
    # every deploy - without this, every push to main silently deleted
    # every file anyone had uploaded since the previous deploy, even though
    # the database rows referencing them stayed intact.
    volumes:
      - /opt/paddle/uploads:/app/wwwroot/uploads
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    build:
      context: ./deploy/nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
