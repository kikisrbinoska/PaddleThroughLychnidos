server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - client-side routes like /shop/5 don't exist as real
    # files, so a hard refresh or direct link must still resolve to
    # index.html and let React Router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
